[package]
name = "UniTerm"
version = "2.0.0"
description = "serial terminal"
authors = ["Phil Spindler"]
license = ""
repository = ""
default-run = "UniTerm"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
ansi-parser = "0.8.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0-beta", features = ["devtools"] }
tokio-serial = "5.4.4"
tokio = { version = "1.29.1", features = ["macros", "time", "sync"] }
tracing = "0.1.35"
tracing-subscriber = "0.3.14"
tauri-plugin-dialog = "2.0.0-alpha.2"
# tauri-plugin-shell = "2.0.0-beta"
# tauri-plugin-dialog = "2.0.0-beta.10"
# tauri-plugin-fs = "2.0.0-beta.10"

